name: N26
description: >-
  N26 is a European mobile-first neobank founded in 2013 and headquartered in
  Berlin, Germany, offering fully digital current accounts, debit and virtual
  cards, spending analytics, sub-accounts (Spaces), overdraft, savings, and
  investment products across the EU, delivered through iOS and Android apps and
  a web banking interface. Surfaced as a portfolio company of Earlybird and
  Insight Partners in the fintech sector. As of this enrichment pass, N26 is a
  consumer bank that publishes no public developer API, developer portal, SDKs,
  or /.well-known/ discovery surface; its integrations are handled through
  private business partnerships rather than self-service API access.
